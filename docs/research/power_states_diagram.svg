<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" width="1600" height="790" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="790" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="28" y="34" font-size="20" font-weight="800" fill="#0f172a">ESS-BMS-16S — Power States, Pre-Discharge Turn-On &amp; Deep-UV State Machine (v1.2)</text><text x="28" y="54" font-size="12.5" fill="#475569">Pack currents at 51.2 V nominal (25 °C) | Hardware kill active in all energized states | "Idle load via PDSG/R_PRE (50 Ω)" is REJECTED</text><rect x="36" y="485" width="320" height="178" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.2"/><text x="50" y="509" font-size="14" font-weight="800" fill="#0f172a">DEEP-UV / SHIP</text><rect x="256" y="493" width="90" height="20" rx="10" fill="#475569"/><text x="301.0" y="507" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">≈ 8 µA typ</text><line x1="48" y1="521" x2="344" y2="521" stroke="#475569" stroke-opacity="0.3" stroke-width="1"/><text x="50" y="540" font-size="11.5" fill="#1e293b">AFE: BQ76952 SHUTDOWN (1–3.1 µA)</text><text x="50" y="557.5" font-size="11.5" fill="#1e293b">FETs: OFF (CHG/DSG/PCHG/PDSG off)</text><text x="50" y="575.0" font-size="11.5" fill="#1e293b">Rails: ALL OFF (PWR_EN=0, REG1=0)</text><text x="50" y="592.5" font-size="11.5" fill="#1e293b">MCU: unpowered (RTC lost)</text><text x="50" y="610.0" font-size="11.5" fill="#1e293b">Entry: Vcell &lt; 2.50 V (60 s) or Ship cmd</text><text x="50" y="627.5" font-size="11.5" fill="#1e293b">Drain: ≈ 0.006 Ah/mo (143 y @ 10% 100 Ah)</text><rect x="470" y="485" width="345" height="178" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/><text x="484" y="509" font-size="14" font-weight="800" fill="#0f172a">STORAGE (Safe Idle)</text><rect x="709" y="493" width="96" height="20" rx="10" fill="#059669"/><text x="757.2" y="507" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">≈ 54 µA est.</text><line x1="482" y1="521" x2="803" y2="521" stroke="#059669" stroke-opacity="0.3" stroke-width="1"/><text x="484" y="540" font-size="11.5" fill="#1e293b">AFE: SLEEP (24–41 µA, protections armed)</text><text x="484" y="557.5" font-size="11.5" fill="#1e293b">FETs: OFF (BOTHOFF, 0 µA kill PDs)</text><text x="484" y="575.0" font-size="11.5" fill="#1e293b">Rails: PWR_EN=0 (LM5013 ≤ 9.9 µA)</text><text x="484" y="592.5" font-size="11.5" fill="#1e293b">MCU: off (RTC alive on AFE_REG1 D109)</text><text x="484" y="610.0" font-size="11.5" fill="#1e293b">Entry: idle &gt; 24–72 h or low SOC (&lt; 10%)</text><text x="484" y="627.5" font-size="11.5" fill="#1e293b">Wake: Button (TS2/Q101), LD, ALERT</text><rect x="930" y="485" width="370" height="178" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/><text x="944" y="509" font-size="14" font-weight="800" fill="#0f172a">SLEEP / STANDBY</text><rect x="1194" y="493" width="96" height="20" rx="10" fill="#2563eb"/><text x="1242.2" y="507" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">≈ 5.5–7.0 mA</text><line x1="942" y1="521" x2="1288" y2="521" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/><text x="944" y="540" font-size="11.5" fill="#1e293b">AFE: NORMAL ↔ SLEEP; DSG LIVE (11 V)</text><text x="944" y="557.5" font-size="11.5" fill="#1e293b">Rails: +5V/+3V3 ON; +5V_ISO ON if bus</text><text x="944" y="575.0" font-size="11.5" fill="#1e293b">  (v1.2 SN6505B saves ≈9 mA vs v1.0 dummy)</text><text x="944" y="592.5" font-size="11.5" fill="#1e293b">MCU: STM32 Stop 1 (87 µA typ, LSE+IWDG)</text><text x="944" y="610.0" font-size="11.5" fill="#1e293b">Wake: CAN/485 RX, |I| &gt; wake, Btn, ALERT</text><text x="944" y="627.5" font-size="11.5" fill="#1e293b">Drain: ≈ 4–5 Ah/mo (inv adds ~290 Ah/mo!)</text><rect x="470" y="92" width="345" height="168" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/><text x="484" y="116" font-size="14" font-weight="800" fill="#0f172a">TURN-ON (Pre-Discharge)</text><rect x="689" y="100" width="116" height="20" rx="10" fill="#d97706"/><text x="747.0" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">≈ 19 mA + pulse</text><line x1="482" y1="128" x2="803" y2="128" stroke="#d97706" stroke-opacity="0.3" stroke-width="1"/><text x="484" y="147" font-size="11.5" fill="#1e293b">Sequence: check faults → close PDSG (Q723)</text><text x="484" y="164.5" font-size="11.5" fill="#1e293b">50 Ω / 100 W charges DC link (τ ≈ 0.25 s)</text><text x="484" y="182.0" font-size="11.5" fill="#1e293b">Verify (V_BAT − V_PACK) &lt; 2 V in ≤ 1.5 s</text><text x="484" y="199.5" font-size="11.5" fill="#1e293b">Then close DSG + CHG banks, open PDSG</text><text x="484" y="217.0" font-size="11.5" fill="#1e293b">Timeout or short → FAULT</text><rect x="950" y="92" width="350" height="168" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><text x="964" y="116" font-size="14" font-weight="800" fill="#0f172a">RUN (Active)</text><rect x="1200" y="100" width="90" height="20" rx="10" fill="#16a34a"/><text x="1245.0" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">≈ 19–26 mA</text><line x1="962" y1="128" x2="1288" y2="128" stroke="#16a34a" stroke-opacity="0.3" stroke-width="1"/><text x="964" y="147" font-size="11.5" fill="#1e293b">AFE: NORMAL (286 µA); ADC + coulomb cnt</text><text x="964" y="164.5" font-size="11.5" fill="#1e293b">FETs: DSG &amp; CHG ON (or P5-01 policy)</text><text x="964" y="182.0" font-size="11.5" fill="#1e293b">Rails: +5V/+3V3/+5V_ISO (+12V/ESP on)</text><text x="964" y="199.5" font-size="11.5" fill="#1e293b">MCU: STM32G473 @ 170 MHz, logging</text><text x="964" y="217.0" font-size="11.5" fill="#1e293b">Exit: |I| &lt; I_idle (t_sleep) → SLEEP</text><rect x="1340" y="290" width="232" height="175" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/><text x="1354" y="314" font-size="14" font-weight="800" fill="#0f172a">FAULT / KILL</text><rect x="1472" y="298" width="90" height="20" rx="10" fill="#dc2626"/><text x="1517.0" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">≈ 19 mA</text><line x1="1352" y1="326" x2="1560" y2="326" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1"/><text x="1354" y="345" font-size="11.5" fill="#1e293b">Hardware AND kills gates (&lt; µs):</text><text x="1354" y="362.5" font-size="11.5" fill="#1e293b">  OC latch (+599/−305 A),</text><text x="1354" y="380.0" font-size="11.5" fill="#1e293b">  AFE DCHG/DDSG, MCU_NRST</text><text x="1354" y="397.5" font-size="11.5" fill="#1e293b">DRV: ALM red LED + DRY1/2</text><text x="1354" y="415.0" font-size="11.5" fill="#1e293b">Exit: fault clear + OC_CLR</text><line x1="180" y1="485" x2="470" y2="180" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)"/><rect x="152" y="313" width="217" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="260" y="325" text-anchor="middle" font-size="10.8" font-weight="700" fill="#0f172a">Charger on LD / TS2 Btn (&gt;2 ms)</text><line x1="470" y1="574" x2="356" y2="574" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr)"/><rect x="361" y="546" width="104" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="413" y="558" text-anchor="middle" font-size="10.8" font-weight="700" fill="#dc2626">Vcell &lt; 2.50 V</text><line x1="642" y1="485" x2="642" y2="260" stroke="#059669" stroke-width="2.2" marker-end="url(#arr)"/><rect x="540" y="358" width="203" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="642" y="370" text-anchor="middle" font-size="10.8" font-weight="700" fill="#059669">Button / ALERT / LD → Pre-dsg</text><line x1="815" y1="176" x2="950" y2="176" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr)"/><rect x="807" y="146" width="151" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="882" y="158" text-anchor="middle" font-size="10.8" font-weight="700" fill="#d97706">ΔV &lt; 2 V → Close FETs</text><line x1="1070" y1="260" x2="1070" y2="485" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr)"/><rect x="936" y="358" width="144" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="1008" y="370" text-anchor="middle" font-size="10.8" font-weight="700" fill="#2563eb">|I| &lt; I_idle (5 min)</text><line x1="1170" y1="485" x2="1170" y2="260" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1166" y="358" width="137" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="1235" y="370" text-anchor="middle" font-size="10.8" font-weight="700" fill="#16a34a">|I| &gt; wake / CAN RX</text><line x1="930" y1="574" x2="815" y2="574" stroke="#059669" stroke-width="2.2" marker-end="url(#arr)"/><rect x="823" y="546" width="98" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="872" y="558" text-anchor="middle" font-size="10.8" font-weight="700" fill="#059669">Idle &gt; t_stor</text><line x1="1300" y1="180" x2="1450" y2="290" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1356" y="203" width="118" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="1415" y="215" text-anchor="middle" font-size="10.8" font-weight="700" fill="#dc2626">SCD/OCD/OV/UV/OT</text><line x1="1300" y1="550" x2="1450" y2="465" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1336" y="516" width="157" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="1415" y="528" text-anchor="middle" font-size="10.8" font-weight="700" fill="#dc2626">Hardware Fault / ALERT</text><line x1="1340" y1="365" x2="815" y2="225" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1030" y="283" width="210" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/><text x="1135" y="295" text-anchor="middle" font-size="10.8" font-weight="700" fill="#475569">Fault Clear + OC_CLR → Pre-dsg</text><rect x="36" y="692" width="1536" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/><text x="52" y="716" font-size="13" font-weight="800" fill="#0f172a">Monthly Pack Drain Comparison (51.2 V, 25 °C) &amp; Why Pre-Charge Idle Supply Fails</text><text x="52" y="736" font-size="11.8" fill="#334155">BMS Monthly Drain: DEEP-UV = 0.006 Ah/mo (0.006%/100 Ah)  |  STORAGE (54 µA) = 0.039 Ah/mo (0.04%)  |  SLEEP/STANDBY (7 mA) = 5.11 Ah/mo (5.1%)  |  Attached 20 W Inverter Idle = 285 Ah/mo (285% — 56× BMS SLEEP).</text><text x="52" y="754" font-size="11.8" fill="#991b1b">Pre-charge Path (50 Ω R_PRE): Pmax = 12.65 W (collapses at 20 W), I = 4.2 mA already burns all 17 µA FET-gate saving, and load steps collapse DC link before re-closing main FETs with inrush.</text>
</svg>
